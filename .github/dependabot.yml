version: 2
updates:
  # Front-end package (repo root)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Cloudflare Worker proxy
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # GitHub Actions used in the CI / Pages workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
